name: Images Docker backend

# Construit les images .NET et FastAPI, les analyse (Trivy), les pousse dans
# Amazon ECR (eu-north-1), puis, si activé, les déploie en conteneurs.
#
#   develop -> images :<sha> et :develop -> intégration (si DOCKER_DEPLOY_INTEGRATION = true)
#   main    -> images :<sha> et :main    -> production  (si DOCKER_DEPLOY_PROD = true,
#                                           environnement GitHub « production »)
#
# Tant que les variables du dépôt DOCKER_DEPLOY_* ne valent pas « true », ce
# workflow construit et publie seulement : les anciens workflows (deploy.yml,
# deploy-integration.yml) continuent de déployer comme avant.
#
# Accès AWS sans clé stockée : GitHub OIDC -> rôle winplus-github-ecr-push,
# limité à l'envoi d'images dans les deux dépôts ECR winplus-*.
# Accès au serveur : secret DOCKER_DEPLOY_SSH_KEY, clé limitée par
# deploy/docker/ssh-gate.sh à « deploy | rollback | status ».

on:
  push:
    branches: [develop, main]
    paths:
      - 'dotnet/**'
      - 'python/**'
      - 'deploy/docker/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: images-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  REGISTRY: 286879406623.dkr.ecr.eu-north-1.amazonaws.com
  AWS_ROLE: arn:aws:iam::286879406623:role/winplus-github-ecr-push
  # Trivy par son image officielle, version figée (pas l'action GitHub, dont
  # des étiquettes ont été détournées en 2026).
  TRIVY_IMAGE: aquasec/trivy:0.58.1
  DEPLOY_HOST: 56.228.79.206

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: winplus-dotnet
            context: dotnet
          - name: winplus-fastapi
            context: python
    steps:
      - uses: actions/checkout@v4

      - name: Identifiants AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connexion ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

      - uses: docker/setup-buildx-action@v3

      - name: Construction
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Analyse de sécurité (Trivy)
        run: |
          IMAGE="$REGISTRY/${{ matrix.name }}:${{ github.sha }}"
          # Rapport complet (HIGH et CRITICAL) dans le résumé du job...
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format table "$IMAGE" \
            | tee trivy.txt
          { echo "## Trivy : ${{ matrix.name }}"; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # ...mais seule une faille CRITIQUE corrigeable bloque la publication.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE" > /dev/null

      - name: Publication
        run: |
          IMAGE="$REGISTRY/${{ matrix.name }}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.ref_name }}"
          echo "Publiée : $IMAGE:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-integration:
    needs: build
    if: github.ref == 'refs/heads/develop' && vars.DOCKER_DEPLOY_INTEGRATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: docker-deploy-integration
      cancel-in-progress: false
    steps:
      - name: Déploiement (intégration)
        env:
          KEY: ${{ secrets.DOCKER_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 15 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy -o BatchMode=yes ubuntu@"$DEPLOY_HOST" "deploy integration $GITHUB_SHA"

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DOCKER_DEPLOY_PROD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: docker-deploy-prod
      cancel-in-progress: false
    steps:
      - name: Déploiement (production)
        env:
          KEY: ${{ secrets.DOCKER_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 15 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy -o BatchMode=yes ubuntu@"$DEPLOY_HOST" "deploy prod $GITHUB_SHA"
