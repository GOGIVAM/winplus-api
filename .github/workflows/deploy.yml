name: Deploy backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 56.228.79.206
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/winplus-repo
            OLD_HEAD=$(git rev-parse HEAD)
            git pull

            echo "--- Migrations SQL nouvelles ou modifiees ---"
            # Seuls les scripts ajoutes/modifies par ce pull sont executes : certains
            # scripts historiques ne sont PAS rejouables sans effet (ex. Seed*Quotas,
            # AddAccessRequestStages). Chaque nouveau script doit etre idempotent.
            # Sans cette etape, une colonne ajoutee a une entite mais pas en base fait
            # echouer toutes les requetes concernees (ex. connexion en 401).
            source ~/winplus/backup.env
            export PGPASSWORD="$DB_PASSWORD"
            for f in $(git diff --name-only --diff-filter=AM "$OLD_HEAD" HEAD -- 'dotnet/Migrations/SQL_*.sql' | grep -v Validation_Check); do
              echo "Application de $f"
              psql -h 172.31.2.201 -U cademi -d winplus_db -v ON_ERROR_STOP=1 -1 -q -f "$f"
            done
            unset PGPASSWORD

            echo "--- Build .NET ---"
            cd dotnet
            dotnet publish -c Release -o ~/winplus/dotnet/publish
            cd ..

            echo "--- Dependances Python ---"
            cd python
            source venv/bin/activate
            pip install -r requirements.txt -q
            deactivate
            cd ..

            sudo systemctl daemon-reload
            sudo systemctl restart winplus-fastapi
            sleep 2
            sudo systemctl restart winplus-backend
            sleep 2
            sudo systemctl is-active winplus-fastapi
            sudo systemctl is-active winplus-backend
