name: Deploy backend integration

# Environnement d'intégration (api.integration.winplus.cm), même serveur que la
# production (56.228.79.206) mais clone, publication, services et base séparés :
#   clone        ~/winplus-integration-repo (branche develop)
#   publication  ~/winplus-integration/dotnet/publish
#   services     winplus-backend-integration (127.0.0.1:5002)
#                winplus-fastapi-integration (127.0.0.1:8001)
#   base         winplus_integration (même serveur PostgreSQL que la production)
# Préparation unique du serveur : infrastructure/integration/PROCEDURE.md.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-backend-integration
  # Un déploiement en cours n'est jamais interrompu (publication à moitié
  # copiée) ; le suivant attend son tour.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH (integration)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 56.228.79.206
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd ~/winplus-integration-repo
            git fetch origin develop
            OLD_HEAD=$(git rev-parse HEAD)
            git checkout -q develop
            git reset -q --hard origin/develop

            echo "--- Migrations SQL nouvelles ou modifiees (winplus_integration) ---"
            source ~/winplus/backup.env
            export PGPASSWORD="$DB_PASSWORD"
            for f in $(git diff --name-only --diff-filter=AM "$OLD_HEAD" HEAD -- 'dotnet/Migrations/SQL_*.sql' | grep -v Validation_Check); do
              echo "Application de $f"
              psql -h 172.31.2.201 -U cademi -d winplus_integration -v ON_ERROR_STOP=1 -1 -q -f "$f"
            done
            unset PGPASSWORD

            echo "--- Build .NET ---"
            cd dotnet
            dotnet publish -c Release -o ~/winplus-integration/dotnet/publish
            cd ..

            echo "--- Dependances Python ---"
            cd python
            [ -d venv ] || python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt -q
            deactivate
            cd ..

            sudo systemctl daemon-reload
            sudo systemctl restart winplus-fastapi-integration
            sleep 2
            sudo systemctl restart winplus-backend-integration
            sleep 3
            sudo systemctl is-active winplus-fastapi-integration
            sudo systemctl is-active winplus-backend-integration
            curl -fsS -m 20 http://127.0.0.1:5002/health > /dev/null && echo "API d'integration en ligne"
